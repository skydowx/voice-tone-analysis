<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoAce Audio Analysis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/evaluation.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">AutoAce <span>Audio Analysis</span></a>
      {% if request.session.get('user') %}
      <nav>
        <a href="/">Batches</a>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button ghost" type="submit">Sign out</button>
        </form>
      </nav>
      {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Confidential evaluation workspace · Audio and transcripts are never written to application logs.</footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
